<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - 뱀 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        #gameCanvas {
            border: 3px solid white;
            border-radius: 10px;
            background-color: #2d3748;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .score-board {
            margin-top: 20px;
            font-size: 1.5em;
            font-weight: bold;
        }

        .controls {
            margin-top: 20px;
            font-size: 1.1em;
            opacity: 0.9;
        }

        .game-over {
            display: none;
            margin-top: 20px;
            font-size: 1.8em;
            color: #ffd700;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }

        button {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .download-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            margin-left: 10px;
        }

        .button-group {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="score-board">
            점수: <span id="score">0</span> | 최고점수: <span id="highScore">0</span>
        </div>
        <div class="game-over" id="gameOver">
            게임 오버! 스페이스바를 눌러 다시 시작하세요
        </div>
        <div class="controls">
            ⬆️⬇️⬅️➡️ 방향키로 조작 | 스페이스바: 재시작
        </div>
        <div class="button-group">
            <button onclick="startGame()">게임 시작</button>
            <button class="download-btn" onclick="downloadGame()">📥 게임 다운로드</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameOverElement = document.getElementById('gameOver');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let isGameRunning = false;

        highScoreElement.textContent = highScore;

        // 키보드 입력 처리
        document.addEventListener('keydown', changeDirection);

        function changeDirection(event) {
            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;
            const SPACE_KEY = 32;

            if (event.keyCode === SPACE_KEY && !isGameRunning) {
                startGame();
                return;
            }

            if (!isGameRunning) return;

            const keyPressed = event.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -1;
                dy = 0;
            }
            if (keyPressed === UP_KEY && !goingDown) {
                dx = 0;
                dy = -1;
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = 1;
                dy = 0;
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }

        function startGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            gameOverElement.style.display = 'none';
            generateFood();

            if (gameLoop) clearInterval(gameLoop);
            isGameRunning = true;
            gameLoop = setInterval(update, 100);
        }

        function update() {
            if (checkCollision()) {
                gameOver();
                return;
            }

            // 뱀 머리 이동
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            // 음식 먹기
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                generateFood();

                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function checkCollision() {
            const head = snake[0];

            // 벽 충돌
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                return true;
            }

            // 자기 몸 충돌
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }

            return false;
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * TILE_COUNT);
            food.y = Math.floor(Math.random() * TILE_COUNT);

            // 뱀 몸과 겹치지 않도록
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }

        function draw() {
            // 배경
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 그리드 그리기
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // 뱀 그리기
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // 머리
                    ctx.fillStyle = '#48bb78';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#48bb78';
                } else {
                    // 몸
                    ctx.fillStyle = '#68d391';
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = '#68d391';
                }
                ctx.fillRect(
                    segment.x * GRID_SIZE + 1,
                    segment.y * GRID_SIZE + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );
            });

            // 음식 그리기
            ctx.fillStyle = '#f56565';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f56565';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2,
                0,
                2 * Math.PI
            );
            ctx.fill();

            ctx.shadowBlur = 0;
        }

        function gameOver() {
            clearInterval(gameLoop);
            isGameRunning = false;
            gameOverElement.style.display = 'block';
        }

        // 게임 다운로드 함수
        function downloadGame() {
            // 현재 HTML 페이지의 전체 내용을 가져오기
            const htmlContent = document.documentElement.outerHTML;

            // Blob 생성
            const blob = new Blob([htmlContent], { type: 'text/html' });

            // 다운로드 링크 생성
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'snake-game.html';

            // 링크 클릭하여 다운로드
            document.body.appendChild(link);
            link.click();

            // 정리
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // 초기 화면 그리기
        draw();
    </script>
</body>
</html>
